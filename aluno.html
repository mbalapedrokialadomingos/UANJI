<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do aluno</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="aluno-page">
    <main class="aluno-shell">
        <nav class="aluno-navbar" aria-label="Navegação da área do aluno">
            <a class="aluno-brand" href="/" aria-label="Página inicial">
                <span class="aluno-brand-mark">U</span>
                <span><strong>UNJILA</strong><small>Área académica</small></span>
            </a>
            <div class="aluno-nav-links">
                <a href="#perfilAluno">Meu perfil</a>
                <a href="#minhasFormacoes">Minhas formações</a>
                <button id="btnLogoutAluno" class="btn btn-ghost btn-small" type="button">Terminar sessão</button>
            </div>
        </nav>

        <section class="aluno-hero" aria-labelledby="nomeAluno">
            <div class="aluno-hero-content">
                <h1 id="nomeAluno">Aluno</h1>
                <p>Encontra disciplinas, consulta explicadores e acompanha o teu percurso académico.</p>
            </div>
        </section>

        <section id="perfilAluno" class="aluno-section aluno-profile-section" aria-labelledby="tituloPerfilAluno">
            <div class="aluno-section-heading">
                <div><h2 id="tituloPerfilAluno">Meu perfil</h2></div>
            </div>
            <div class="aluno-profile-card">
                <div><span>Nome</span><strong id="perfilNomeAluno">A carregar...</strong></div>
                <div><span>Email</span><strong id="perfilEmailAluno">A carregar...</strong></div>
            </div>
        </section>

        <section id="solicitacoesApoioAluno" class="aluno-section aluno-support-section" aria-labelledby="tituloApoioAluno">
            <div class="aluno-section-heading">
                <div><h2 id="tituloApoioAluno">Solicitações de Apoio</h2></div>
            </div>
            <div class="aluno-support-card">
                <div id="listaSolicitacoesAluno" class="lista-solicitacoes-aluno"><p class="empty-state">A carregar solicitações...</p></div>
            </div>
        </section>

        <section id="minhasFormacoes" class="aluno-section aluno-formacoes-section" aria-labelledby="tituloFormacoesAluno">
            <div class="aluno-section-heading"><div><h2 id="tituloFormacoesAluno">Minhas formações</h2></div></div>
            <div id="listaMinhasInscricoes" class="lista-aluno"></div>
        </section>
    </main>

    <div id="modalAcademia" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModalAcademia">
        <div class="modal-conteudo academia-modal-content">
            <button id="fecharModalAcademia" class="fechar-modal" type="button" aria-label="Fechar">&times;</button>
            <div id="conteudoModalAcademia"></div>
        </div>
    </div>

    <script src="js/aluno.js"></script>
</body>
</html>
