<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <h1>Alterar password</h1>
                <p>Por segurança, define uma nova password antes de continuar.</p>
            </div>
            <form id="formAlterarPassword" class="login-form">
                <div class="campo">
                    <label for="novaPassword">Nova password</label>
                    <input id="novaPassword" type="password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}" title="Use pelo menos 8 caracteres, uma maiúscula, uma minúscula, um número e um símbolo." autocomplete="new-password" required>
                    <small class="form-help">Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo.</small>
                </div>
                <div class="campo">
                    <label for="confirmarPassword">Confirmar password</label>
                    <input id="confirmarPassword" type="password" minlength="8" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary login-btn" type="submit">Guardar password</button>
            </form>
            <p id="mensagemAlterarPassword" class="mensagem"></p>
        </section>
    </main>
    <script src="js/alterar-password.js"></script>
</body>
</html>
